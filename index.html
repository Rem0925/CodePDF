<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>APA PDF Generator Studio - CodePDF v2</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1",
                        secondary: "#4f46e5",
                        "background-light": "#f3f4f6",
                        "background-dark": "#0f172a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                        "border-light": "#e5e7eb",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"],
                    },
                },
            },
        };
    </script>

    <link rel="stylesheet" href="style/style.css">
</head>
<body class="h-screen w-full overflow-hidden bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 dark">
    <div class="flex h-full w-full">
        <!-- Sidebar -->
        <aside class="w-20 flex-shrink-0 flex flex-col items-center py-6 bg-surface-light dark:bg-surface-dark border-r border-border-light dark:border-border-dark z-20 shadow-sm">
            <div class="mb-8 w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <span class="material-symbols-outlined text-xl">description</span>
            </div>
            <nav class="flex-1 flex flex-col space-y-6 w-full items-center">
                <button class="group relative p-3 rounded-xl text-primary bg-indigo-50 dark:bg-indigo-500/10 dark:text-indigo-400 transition-all hover:scale-105" title="Editor">
                    <span class="material-symbols-outlined">code</span>
                </button>
                <button onclick="saveToLocal()" class="group relative p-3 rounded-xl text-slate-400 hover:text-primary transition-all" title="Guardar Localmente">
                    <span class="material-symbols-outlined">save</span>
                </button>
                <button onclick="downloadSource()" class="group relative p-3 rounded-xl text-slate-400 hover:text-primary transition-all" title="Descargar Código Fuente">
                    <span class="material-symbols-outlined">download</span>
                </button>
                <div class="h-px w-8 bg-border-light dark:bg-border-dark my-2"></div>
                <a href="Documentacion.html" target="_blank" class="group relative p-3 rounded-xl text-slate-400 hover:text-primary transition-all" title="Documentación">
                    <span class="material-symbols-outlined">menu_book</span>
                </a>
            </nav>
            <button onclick="toggleTheme()" class="p-3 rounded-xl text-slate-400 hover:text-indigo-500 transition-all" title="Cambiar Tema">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <header class="h-16 px-6 bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark flex items-center justify-between shrink-0 z-10">
                <div class="flex items-center space-x-4">
                    <h1 class="text-lg font-semibold tracking-tight text-slate-800 dark:text-white">APA Generator Studio</h1>
                    <span class="px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800">APA 7th Ed.</span>
                    <span id="save-status" class="text-xs text-slate-400 flex items-center gap-1 opacity-0 transition-opacity">
                        <span class="material-symbols-outlined text-[14px]">cloud_done</span> Guardado
                    </span>
                </div>
                <button id="generateBtn" onclick="generatePDF()" class="flex items-center space-x-2 bg-primary hover:bg-secondary text-white px-5 py-2.5 rounded-lg shadow-md transition-all active:scale-95 font-medium">
                    <span class="material-symbols-outlined text-xl">picture_as_pdf</span>
                    <span>Generar Documento</span>
                </button>
            </header>

            <div class="flex-1 flex overflow-hidden">
                <!-- Editor Section -->
                <section class="flex-1 flex flex-col border-r border-border-light dark:border-border-dark bg-slate-50 dark:bg-slate-900/50 relative min-w-[300px]">
                    <!-- Toolbar Agregada -->
                    <div class="h-10 px-2 flex items-center justify-between bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark overflow-x-auto custom-scrollbar">
                        <div class="flex items-center space-x-1">
                            <button onclick="insertTagFromToolbar('titulo1')" class="toolbar-btn text-slate-600 dark:text-slate-300" title="Insertar Título 1">
                                <span class="material-symbols-outlined text-sm">title</span> T1
                            </button>
                            <button onclick="insertTagFromToolbar('titulo2')" class="toolbar-btn text-slate-600 dark:text-slate-300" title="Insertar Título 2">
                                <span class="material-symbols-outlined text-sm">title</span> T2
                            </button>
                            <button onclick="insertTagFromToolbar('parr')" class="toolbar-btn text-slate-600 dark:text-slate-300" title="Insertar Párrafo">
                                <span class="material-symbols-outlined text-sm">segment</span> Parr
                            </button>
                            <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>
                            <button onclick="insertTagFromToolbar('Introduccion')" class="toolbar-btn text-slate-600 dark:text-slate-300" title="Sección Introducción">
                                <span class="material-symbols-outlined text-sm">article</span> Intro
                            </button>
                            <button onclick="insertTagFromToolbar('Conclusion')" class="toolbar-btn text-slate-600 dark:text-slate-300" title="Sección Conclusión">
                                <span class="material-symbols-outlined text-sm">flag</span> Fin
                            </button>
                            <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>
                            <button onclick="insertTagFromToolbar('pagebreak')" class="toolbar-btn text-slate-600 dark:text-slate-300" title="Salto de Página">
                                <span class="material-symbols-outlined text-sm">insert_page_break</span> Salto
                            </button>
                        </div>
                        <div class="text-xs text-slate-400 font-mono hidden md:block">Editor</div>
                    </div>
                    
                    <div class="flex-1 relative overflow-hidden">
                        <textarea id="code" name="code"></textarea>
                        <div id="autocomplete-container"></div>
                    </div>
                    
                    <!-- Footer del Editor: Contador de Palabras -->
                    <div class="h-6 bg-surface-light dark:bg-surface-dark border-t border-border-light dark:border-border-dark flex items-center justify-end px-4 text-[10px] text-slate-400">
                        <span id="word-count">0 palabras</span>
                        <span class="mx-2">|</span>
                        <span id="char-count">0 caracteres</span>
                    </div>
                </section>

                <section class="flex-1 bg-slate-200 dark:bg-slate-800 flex flex-col overflow-hidden relative">
                    <div class="h-10 px-4 flex items-center justify-between border-b border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark shrink-0">
                        <span class="text-xs font-medium text-slate-500 uppercase">Vista Previa PDF</span>
                        <div class="flex items-center space-x-2">
                           <span class="text-xs text-slate-400">Visor Nativo</span>
                        </div>
                    </div>
                    <div class="flex-1 relative w-full h-full">
                        <iframe id="preview" title="Previsualización del PDF"></iframe>
                        <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-0 bg-slate-100 dark:bg-slate-900">
                            <span class="material-symbols-outlined text-6xl mb-4 opacity-50">picture_as_pdf</span>
                            <p>Presiona "Generar Documento" para ver el resultado</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>

    <script src="js/Logic.js"></script>
</body>
</html>
